<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KES Updates — Ad Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1a1d29; --muted:#6b7280;
    --border:#e5e7eb; --primary:#2563eb; --primary-dark:#1e40af;
    --success:#16a34a; --danger:#dc2626; --radius:14px;
    --shadow:0 4px 24px rgba(20,20,40,0.06);
  }
  [data-theme="dark"]{
    --bg:#0f1117; --card:#181b26; --text:#eef0f7; --muted:#9099ac;
    --border:#2a2e3d; --shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; transition:background .3s,color .3s;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px;}
  .brand span{color:var(--primary);}
  .theme-toggle{
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    width:40px; height:40px; cursor:pointer; font-size:18px; display:flex;
    align-items:center; justify-content:center; color:var(--text);
  }
  .wrap{
    display:grid; grid-template-columns:1fr 1fr; gap:24px;
    max-width:1080px; margin:32px auto; padding:0 20px;
  }
  @media (max-width:860px){ .wrap{grid-template-columns:1fr;} }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px;
  }
  .card h2{margin:0 0 4px; font-size:20px;}
  .card p.sub{margin:0 0 20px; color:var(--muted); font-size:13.5px;}

  label{display:block; margin-top:16px; margin-bottom:6px; font-weight:600; font-size:13.5px; color:var(--text);}
  input[type=text], textarea{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
    background:var(--bg); color:var(--text); font-family:inherit; font-size:14px; outline:none;
    transition:border .2s;
  }
  input[type=text]:focus, textarea:focus{border-color:var(--primary);}
  textarea{resize:vertical; min-height:70px;}

  .drop-zone{
    margin-top:8px; border:2px dashed var(--border); border-radius:12px; padding:24px;
    text-align:center; cursor:pointer; color:var(--muted); font-size:13.5px; position:relative;
    transition:border-color .2s, background .2s;
  }
  .drop-zone.dragover{border-color:var(--primary); background:rgba(37,99,235,0.06);}
  .drop-zone input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .drop-zone strong{color:var(--primary);}

  .divider{display:flex; align-items:center; gap:10px; margin:18px 0 4px; color:var(--muted); font-size:12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}

  button{
    margin-top:22px; width:100%; padding:13px; background:var(--primary); color:#fff;
    border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
    transition:background .2s, transform .1s;
  }
  button:hover:not(:disabled){background:var(--primary-dark);}
  button:active:not(:disabled){transform:scale(0.99);}
  button:disabled{background:var(--muted); cursor:not-allowed;}

  .status{margin-top:14px; font-size:13.5px; font-weight:600; text-align:center; min-height:18px; white-space:pre-wrap;}

  /* Live preview */
  .preview-label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:14px;}
  .ad-popup{
    border-radius:16px; overflow:hidden; border:1px solid var(--border); background:var(--bg);
    max-width:340px; margin:0 auto; box-shadow:var(--shadow);
  }
  .ad-popup .img-wrap{
    width:100%; aspect-ratio:16/9; background:linear-gradient(135deg,#dbeafe,#eef2ff);
    display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:13px;
  }
  [data-theme="dark"] .ad-popup .img-wrap{background:linear-gradient(135deg,#1e2233,#20263b);}
  .ad-popup .img-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .ad-popup .body{padding:16px 18px 18px;}
  .ad-popup h3{margin:0 0 6px; font-size:16px;}
  .ad-popup p{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.5;}
  .ad-popup .cta{
    display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
    padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:700;
  }
  .empty-hint{font-size:13px; color:var(--muted); text-align:center; padding:30px 10px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">📢 KES <span>Ads</span> Admin</div>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme" type="button">🌙</button>
</div>

<div class="wrap">

  <!-- FORM -->
  <div class="card">
    <h2>Create / Update Ad</h2>
    <p class="sub">This replaces the currently active popup ad on the live site.</p>

    <form id="adForm">
      <label>Ad Title</label>
      <input type="text" id="title" placeholder="e.g., Big Summer Sale!" required>

      <label>Description</label>
      <textarea id="description" placeholder="Get 50% off on all courses..."></textarea>

      <label>Ad Image</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="imageFile" accept="image/*">
        <span id="dropText">Drag & drop an image here, or <strong>click to browse</strong></span>
      </div>

      <div class="divider">OR</div>

      <label>Paste Image URL</label>
      <input type="text" id="image_url" placeholder="https://example.com/image.jpg">

      <label>Button Link (where clicking the ad goes)</label>
      <input type="text" id="cta_link" placeholder="https://your-sale-page.com">

      <button type="submit" id="submitBtn">🚀 Save & Activate Ad</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </div>

  <!-- LIVE PREVIEW -->
  <div class="card">
    <div class="preview-label">Live Preview</div>
    <div class="ad-popup">
      <div class="img-wrap" id="previewImgWrap">
        <span id="previewImgHint">No image yet</span>
      </div>
      <div class="body">
        <h3 id="previewTitle">Your ad title appears here</h3>
        <p id="previewDesc">Your description will appear here as you type.</p>
        <a href="#" class="cta" id="previewCta" onclick="return false;">Learn More</a>
      </div>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://jbyctjddlbyddzavmczg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpieWN0amRkbGJ5ZGR6YXZtY3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzE2NzYsImV4cCI6MjA5Nzk0NzY3Nn0.klEa0-zSGbHZYA-fYiHYg4ceoL1PQ87gowGEbvVmhqU';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ---------- Theme toggle ---------- */
  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Elements ---------- */
  const form = document.getElementById('adForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');
  const titleInput = document.getElementById('title');
  const descInput = document.getElementById('description');
  const ctaInput = document.getElementById('cta_link');
  const urlInput = document.getElementById('image_url');
  const fileInput = document.getElementById('imageFile');
  const dropZone = document.getElementById('dropZone');
  const dropText = document.getElementById('dropText');

  const previewTitle = document.getElementById('previewTitle');
  const previewDesc = document.getElementById('previewDesc');
  const previewCta = document.getElementById('previewCta');
  const previewImgWrap = document.getElementById('previewImgWrap');

  function setStatus(msg, color){ statusMsg.textContent = msg; statusMsg.style.color = color; }

  /* ---------- Live text preview ---------- */
  titleInput.addEventListener('input', () => {
    previewTitle.textContent = titleInput.value.trim() || 'Your ad title appears here';
  });
  descInput.addEventListener('input', () => {
    previewDesc.textContent = descInput.value.trim() || 'Your description will appear here as you type.';
  });
  ctaInput.addEventListener('input', () => {
    previewCta.textContent = ctaInput.value.trim() ? 'Learn More' : 'Learn More';
  });

  /* ---------- Image preview (file or URL) ---------- */
  function showImagePreview(src){
    previewImgWrap.innerHTML = '';
    const img = document.createElement('img');
    img.src = src;
    previewImgWrap.appendChild(img);
  }
  function clearImagePreview(){
    previewImgWrap.innerHTML = '<span>No image yet</span>';
  }

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0){
      const file = fileInput.files[0];
      dropText.innerHTML = '✅ Selected: <strong>' + file.name + '</strong>';
      const reader = new FileReader();
      reader.onload = e => showImagePreview(e.target.result);
      reader.readAsDataURL(file);
      urlInput.value = '';
    }
  });

  urlInput.addEventListener('input', () => {
    if (urlInput.value.trim()){
      showImagePreview(urlInput.value.trim());
      fileInput.value = '';
      dropText.innerHTML = 'Drag & drop an image here, or <strong>click to browse</strong>';
    } else {
      clearImagePreview();
    }
  });

  ['dragenter','dragover'].forEach(evt =>
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('dragover'); })
  );
  ['dragleave','drop'].forEach(evt =>
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('dragover'); })
  );
  dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length > 0){
      fileInput.files = e.dataTransfer.files;
      fileInput.dispatchEvent(new Event('change'));
    }
  });

  /* ---------- Submit ---------- */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    setStatus('Saving...', 'var(--muted)');

    try {
      const { error: deactivateError } = await sb
        .from('advertisements')
        .update({ is_active: false })
        .eq('is_active', true);
      if (deactivateError) throw new Error('Could not deactivate old ads: ' + deactivateError.message);

      let finalImageUrl = urlInput.value.trim();

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const fileName = 'ad_' + Date.now() + '.' + ext;

        const { error: uploadError } = await sb.storage.from('ads').upload(fileName, file, {
          cacheControl: '3600', upsert: false, contentType: file.type || 'image/jpeg'
        });
        if (uploadError) throw new Error('Image upload failed: ' + uploadError.message);

        const { data: publicUrlData } = sb.storage.from('ads').getPublicUrl(fileName);
        finalImageUrl = publicUrlData.publicUrl;
      }

      if (!finalImageUrl) throw new Error('Please upload an image or paste an image URL.');

      const newAd = {
        title: titleInput.value.trim(),
        description: descInput.value.trim(),
        image_url: finalImageUrl,
        cta_link: ctaInput.value.trim(),
        is_active: true
      };

      const { error: insertError } = await sb.from('advertisements').insert([newAd]);
      if (insertError) throw new Error('Could not save ad: ' + insertError.message);

      setStatus('✅ Ad Activated! Go check your live site.', 'var(--success)');
      form.reset();
      clearImagePreview();
      previewTitle.textContent = 'Your ad title appears here';
      previewDesc.textContent = 'Your description will appear here as you type.';
      dropText.innerHTML = 'Drag & drop an image here, or <strong>click to browse</strong>';

    } catch (err) {
      console.error(err);
      setStatus('❌ ' + err.message, 'var(--danger)');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
