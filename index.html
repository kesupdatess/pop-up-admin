<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #e8eaf1; padding: 40px; }
    .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1e40af; }
    button:disabled { background: #93a5c9; cursor: not-allowed; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <h1>📢 Ad Admin Panel</h1>
  <p style="text-align:center; color:#777;">Fill this form to change the popup ad on your dummy website.</p>

  <form id="adForm">
    <label>Ad Title:</label>
    <input type="text" id="title" placeholder="e.g., Big Summer Sale!" required>

    <label>Description:</label>
    <textarea id="description" placeholder="Get 50% off on all courses..."></textarea>

    <label>Upload Image from PC:</label>
    <input type="file" id="imageFile" accept="image/*">

    <label>OR Paste Image URL:</label>
    <input type="text" id="image_url" placeholder="https://example.com/image.jpg">

    <label>Link (When user clicks the button):</label>
    <input type="text" id="cta_link" placeholder="https://your-sale-page.com">

    <button type="submit" id="submitBtn">🚀 Save & Activate Ad</button>
  </form>
  <div class="status" id="statusMsg"></div>
</div>

<script>
  const SUPABASE_URL = 'https://jbyctjddlbyddzavmczg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpieWN0amRkbGJ5ZGR6YXZtY3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzE2NzYsImV4cCI6MjA5Nzk0NzY3Nn0.klEa0-zSGbHZYA-fYiHYg4ceoL1PQ87gowGEbvVmhqU';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('adForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');

  function setStatus(msg, color) {
    statusMsg.innerText = msg;
    statusMsg.style.color = color;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    setStatus('Saving...', 'blue');

    try {
      // 1. Turn off all old ads (check for error instead of ignoring it)
      const { error: deactivateError } = await sb
        .from('advertisements')
        .update({ is_active: false })
        .eq('is_active', true);

      if (deactivateError) {
        throw new Error('Could not deactivate old ads: ' + deactivateError.message);
      }

      let finalImageUrl = document.getElementById('image_url').value.trim();

      // 2. If user selected a file from PC, upload it to Supabase Storage
      const fileInput = document.getElementById('imageFile');
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const fileName = 'ad_' + Date.now() + '.' + ext;

        const { error: uploadError } = await sb
          .storage
          .from('ads')
          .upload(fileName, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type || 'image/jpeg'
          });

        if (uploadError) {
          throw new Error('Image upload failed: ' + uploadError.message);
        }

        const { data: publicUrlData } = sb.storage.from('ads').getPublicUrl(fileName);
        finalImageUrl = publicUrlData.publicUrl;
      }

      if (!finalImageUrl) {
        throw new Error('Please upload an image or paste an image URL.');
      }

      // 3. Build ad object
      const newAd = {
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        image_url: finalImageUrl,
        cta_link: document.getElementById('cta_link').value.trim(),
        is_active: true
      };

      // 4. Save to Supabase Database
      const { error: insertError } = await sb.from('advertisements').insert([newAd]);

      if (insertError) {
        throw new Error('Could not save ad: ' + insertError.message);
      }

      setStatus('✅ Ad Activated! Go check your dummy website.', 'green');
      form.reset();

    } catch (err) {
      console.error(err);
      setStatus('❌ ' + err.message, 'red');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
